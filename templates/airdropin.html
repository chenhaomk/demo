<!DOCTYPE html>
<html>
  <head lang="en">
    <meta charset="utf-8" />
    <!-- <link rel="stylesheet" href="style.css" /> -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="Shortcut Icon"
      href="../static/img/picstrickicon.png"
      type="image/x-icon"
    />
    <title>Airwallex Checkout Playground</title>
    <style>
      /**
        * style.css
        * Airwallex Payment Demo - Static HTML.  Created by Josie Ku.
        *
        * This file provides styling to the demo site.  This is not required for the integration.
        */

      body {
        font-family: "AxLLCircular";
        padding: 15px 25px;
      }

      span#code {
        font-family: monospace;
        background-color: lightgrey;
        font-size: 16px;
      }

      div#links {
        display: flex;
        flex-direction: column;
      }

      button {
        margin-top: 15px;
        font-family: "AxLLCircular";
        padding: 5px 10px;
        font-weight: 500;
        cursor: pointer;
        background-color: #612fff;
        color: #fff;
        outline: none;
        border: none;
        border-radius: 5px;
        min-width: 40px;
        min-height: 40px;
      }

      button:disabled {
        opacity: 0.75;
      }

      p#error {
        background: #ffebee;
        border-radius: 5px;
        padding: 5px 10px;
        max-width: 400px;
        display: none;
      }
      p#success {
        background: lightgreen;
        border-radius: 5px;
        padding: 5px 10px;
        max-width: 400px;
        display: none;
      }

      p#author {
        margin-top: 100px;
      }

      .field-container {
        margin: 15px 0px;
      }

      div.instruction-container {
        padding: 10px 50px;
        text-align: left;
      }

      span#code {
        font-family: monospace;
        background-color: lightgrey;
        font-size: 16px;
        margin: 0px 5px;
      }

      p#bullet {
        font-weight: bold;
      }

      @font-face {
        src: url("https://checkout.airwallex.com/fonts/CircularXXWeb/CircularXXWeb-Bold.woff");
        font-family: "AxLLCircular";
        weight: "bold";
      }
      @font-face {
        src: url("https://checkout.airwallex.com/fonts/CircularXXWeb/CircularXXWeb-Regular.woff2");
        font-family: "AxLLCircular";
        weight: "400";
      }
      .content {
        margin: 0 auto;
        display: flex;
        justify-content: space-between;
        width: 960px;
      }
      .content-left {
        display: none;
        background-color: #f8f8f8;
        width: 420px;
        padding: 40px 30px 0 30px;
      }
      .content-left h2 {
        margin: 0;
        padding: 0;
        margin-top: 60px;
        padding-bottom: 40px;
        text-align: center;
        border-bottom: 1px solid #d1d0d8;
      }
      .monthly-plan {
        display: flex;
        justify-content: space-between;
        padding: 0 16px;
        margin-bottom: 50px;
        margin-top: 20px;
      }
      .monthly-plan div:first-child {
        font-weight: bold;
      }
      .total-due {
        display: flex;
        justify-content: space-between;
        padding: 0 16px 30px 16px;
        border-bottom: 1px solid #d1d0d8;
        margin-bottom: 8px;
      }
      .total-due div:last-child {
        font-weight: bold;
        font-size: 18px;
      }
      .timer {
        color: #b2b1b2;
        font-size: 18px;
      }
    </style>
    <!-- 
       STEP #1: Import airwallex-payment-elements bundle
     -->
    <script src="https://checkout.airwallex.com/assets/elements.bundle.min.js"></script>
    <script src="../static/js/jquery.2.1.4.min.js"></script>
  </head>
  <body>
    <div style="text-align: center">
      <h1>Choose Your Payment for PicsTrick!</h1>
    </div>
    <!-- Example below: loading state when element is not yet mounted -->
    <p id="loading">Loading...</p>
    <!-- 
        STEP #3: Add an empty container for the dropIn element to be injected into 
        - Ensure this is the only element in your document with this id, otherwise the element may fail to mount.
      -->
    <div class="content">
      <div class="content-left">
        <div>
          <h2>Micoreate Credit Subscription</h2>
          <div class="monthly-plan">
            <div>Monthly Plan(80 Credits)</div>
            <div>$12.99</div>
          </div>
          <div class="total-due">
            <div>Total due</div>
            <div>$12.99</div>
          </div>
          <div class="timer">
            Renewal on <span class="month">September</span>
            <span class="days">12</span>,at
            <span class="total-due-num">$12.99</span> every month.
          </div>
        </div>
      </div>
      <div class="payment">
        <div id="dropIn"></div>
      </div>
    </div>

    <!-- Example: Response message containers -->
    <p id="error"></p>
    <p id="success"></p>
    <script>
      try {
        // STEP #2: Initialize the Airwallex global context for event communication
        Airwallex.init({
          env: "prod", // Setup which Airwallex env('staging' | 'demo' | 'prod') to integrate with
          origin: window.location.origin, // Setup your event target to receive the browser events message
          locale: "en",
          fonts: [
            // Customizes the font for the payment elements
            {
              src: "https://checkout.airwallex.com/fonts/CircularXXWeb/CircularXXWeb-Regular.woff2",
              family: "AxLLCircular",
              weight: 400,
            },
          ],
        });

        // STEP #4: Create 'dropIn' element
        const dropIn = Airwallex.createElement("dropIn", {
          intent_id: "{{intent_id}}",
          currency: "{{currency}}",
          client_secret: "{{client_secret}}",
        });
        // STEP #5: Mount 'dropIn' element
        dropIn.mount("dropIn"); // This 'dropIn' id MUST MATCH the id on your empty container created in Step 3
        document.getElementById("loading").style.display = "none";
      } catch (error) {
        document.getElementById("loading").style.display = "none"; // Example: hide loading state
        document.getElementById("error").style.display = "block"; // Example: show error
        document.getElementById("error").innerHTML = error.message; // Example: set error message
        console.error("There was an error", error);
      }

      // STEP #6: Add an event listener to handle events when the element is mounted
      window.addEventListener("onReady", (event) => {
        /*
           ... Handle event
         */
        document.getElementById("dropIn").style.display = "block"; // Example: show element when mounted
        document.getElementById("content-left").style.display = "block"; // Example: show element when mounted
        document.getElementById("loading").style.display = "none"; // Example: hide loading tag when element is mounted
        console.log("Element is ready", event.detail);
      });

      // STEP #7: Add an event listener to handle events when the payment is successful.
      window.addEventListener("onSuccess", (event) => {
        /*
           ... Handle event on success
         */
        document.getElementById("success").style.display = "block"; // Example: show success block
        console.warn(event.detail);

        $.ajax({
          type: "POST",
          url: "airwallexcallback",
          data: JSON.stringify(event.detail),
          contentType: "application/json;charset=utf-8",
          success: function (data) {
            window.location.href = data["redirect"];
          },
          error: function (XMLHttpRequest, textStatus, errorThrown) {
            console.log(XMLHttpRequest.status);
            console.log(XMLHttpRequest.readyState);
            console.log("aaa", textStatus);
          },

          complete: function (XMLHttpRequest, textStatus) {
            this; // 调用本次AJAX请求时传递的options参数
          },
        });
      });

      // STEP #8: Add an event listener to handle events when the payment has failed.
      window.addEventListener("onError", (event) => {
        const { error } = event.detail;
        document.getElementById("error").style.display = "block"; // Example: show error block
        document.getElementById("error").innerHTML = error.message; // Example: set error message
        console.error("There was an error", error);
      });
    </script>
  </body>
  <style>
    #dropIn {
      width: 480px;
      /* Example: to hide element before it is loaded */
      display: none;
      text-align: center; /*让div内部文字居中*/
      background-color: #fff;
      border-radius: 20px;
      /* height: 700px; */
      margin: auto;
      /* position: absolute; */
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }
  </style>
</html>
